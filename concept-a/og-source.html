<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#141414;--cream:#FFF6EC;--orange:#FF4D00;--mint:#9EE6B8;--lav:#C9BCFF;--yellow:#FFD23F}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:var(--cream);color:var(--ink);font-family:'Cairo',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;text-align:center}
.latin{font-family:'Anton',sans-serif;font-weight:400}
.kicker{display:inline-block;font-weight:800;font-size:26px;background:var(--mint);border:3px solid var(--ink);border-radius:99px;padding:10px 30px;box-shadow:5px 5px 0 var(--ink);transform:rotate(1.5deg);margin-bottom:34px}
.brand{display:block;font-size:150px;line-height:.95;color:var(--ink);text-shadow:.045em .045em 0 var(--orange);letter-spacing:.01em}
.sub{font-size:30px;letter-spacing:.5em;font-weight:800;opacity:.78;margin-top:22px}
.sub i{font-style:normal;color:var(--orange)}
.services{margin-top:34px;font-size:27px;font-weight:700;color:#3d3a35}
.services b{color:var(--ink)}
.star{position:absolute}
.star1{top:64px;right:72px;width:88px}
.star2{bottom:70px;left:84px;width:70px}
.dot{position:absolute;border-radius:50%;border:3px solid var(--ink)}
.dot1{top:110px;left:120px;width:44px;height:44px;background:var(--lav)}
.dot2{bottom:96px;right:140px;width:34px;height:34px;background:var(--yellow)}
</style>
</head>
<body>
<svg class="star star1" viewBox="0 0 60 60" fill="none"><path d="M30 0l6 22 22 8-22 8-6 22-6-22-22-8 22-8z" fill="#FF4D00" stroke="#141414" stroke-width="2.5"/></svg>
<svg class="star star2" viewBox="0 0 60 60" fill="none"><path d="M30 0l6 22 22 8-22 8-6 22-6-22-22-8 22-8z" fill="#FFD23F" stroke="#141414" stroke-width="2.5"/></svg>
<span class="dot dot1"></span>
<span class="dot dot2"></span>
<span class="kicker">وكالة دعاية وتسويق رقمي</span>
<h1 class="brand latin" dir="ltr">CANNAVARO</h1>
<div class="sub" dir="ltr">MEDIA <i>•</i> CONTENT <i>•</i> WEB</div>
<div class="services"><b>مواقع ومتاجر</b> • محتوى وهوية • حملات ممولة • تعليق صوتي</div>
</body>
</html>
